="268.50" font-size="3.0" text-anchor="start">3. Print flat, tab up.</text><rect x="5.00" y="5.00" width="410.00" height="287.00" class="bd" fill="none"/><rect x="228.00" y="246.00" width="187.00" height="46.00" class="bd" fill="none"/><line x1="228.00" y1="258.00" x2="415.00" y2="258.00" class="th"/><line x1="228.00" y1="270.00" x2="415.00" y2="270.00" class="th"/><line x1="228.00" y1="281.00" x2="415.00" y2="281.00" class="th"/><line x1="288.00" y1="258.00" x2="288.00" y2="292.00" class="th"/><line x1="348.00" y1="258.00" x2="348.00" y2="292.00" class="th"/><text x="231.00" y="254.50" font-size="5" text-anchor="start" font-weight="bold">P07  Head back plate</text><text x="412.00" y="254.50" font-size="3" text-anchor="end" font-weight="bold">DIMENSIONED</text><text x="230.00" y="262.00" font-size="2.0" text-anchor="start">PROJECT</text><text x="230.00" y="266.60" font-size="2.8" text-anchor="start">C-UAS Turret</text><text x="290.00" y="262.00" font-size="2.0" text-anchor="start">MATERIAL</text><text x="290.00" y="266.60" font-size="2.8" text-anchor="start">PETG or PLA, 3 walls, 25% infill</text><text x="350.00" y="262.00" font-size="2.0" text-anchor="start">QTY</text><text x="350.00" y="266.60" font-size="2.8" text-anchor="start">1</text><text x="230.00" y="273.50" font-size="2.0" text-anchor="start">SCALE</text><text x="230.00" y="278.10" font-size="2.8" text-anchor="start">2:1</text><text x="290.00" y="273.50" font-size="2.0" text-anchor="start">UNITS</text><text x="290.00" y="278.10" font-size="2.8" text-anchor="start">mm   3rd-angle projection</text><text x="350.00" y="273.50" font-size="2.0" text-anchor="start">DATE</text><text x="350.00" y="278.10" font-size="2.8" text-anchor="start">Nov 25, 2026</text><text x="230.00" y="285.00" font-size="2.0" text-anchor="start">DRAWN</text><text x="230.00" y="289.60" font-size="2.8" text-anchor="start">Claude (from build.py v5b)</text><text x="290.00" y="285.00" font-size="2.0" text-anchor="start">CAD</text><text x="290.